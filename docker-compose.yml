services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./models:/app/models:ro
    environment:
      API_KEY: ${API_KEY:?Set a strong non-default API_KEY in .env}
      REQUIRE_API_KEY: "true"
      PORT: "9090"
      HOST: "0.0.0.0"
      DEFAULT_VOICE: ${DEFAULT_VOICE:-af_bella}
      ONNX_MODEL_PATH: /app/models/kokoro/kokoro-v0_19.onnx
      VOICES_PATH: /app/models/kokoro/voices.json
      ONNX_PROVIDER: CPUExecutionProvider
